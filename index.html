<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SamGal diagnostics</title>
  <style>
    body { margin: 0; padding: 40px 60px; background: #000; color: #fff; font-family: sans-serif; }
    h1 { font-size: 40px; margin: 0 0 6px; }
    .drow { font-size: 22px; line-height: 1.3; margin: 8px 0; word-break: break-all; }
    .drow b { display: block; font-size: 24px; }
    .pass b { color: #6fdc8c; } .fail b { color: #ff6b6b; } .info { opacity: .8; }
  </style>
</head>
<body>
  <h1>SamGal diagnostics (build 6)</h1>
  <div id="rows">Starting…</div>
  <div class="drow info">OK = run again</div>
  <script src="js/diagnose.js"></script>
  <script>
    var box = document.getElementById('rows');
    function add(state, name, detail) {
      var d = document.createElement('div'); d.className = 'drow ' + state;
      var b = document.createElement('b'); b.textContent = (state === 'pass' ? 'PASS ' : state === 'fail' ? 'FAIL ' : '') + name;
      var t = document.createElement('span'); t.textContent = detail || '';
      d.appendChild(b); d.appendChild(t); box.appendChild(d);
    }
    window.onerror = function (msg, src, line) { add('fail', 'JS error', msg + ' @' + line); };
    function run() {
      box.innerHTML = '';
      var cfg = {};
      try { cfg = JSON.parse(localStorage.getItem('samgal') || '{}'); } catch (e) {}
      var url = cfg.url || 'https://immich.lan.donde.ro';
      runDiagnostics(url, cfg.key || '', function (r) { add(r.state, r.name, r.detail); })
        .then(function () { add('info', 'Done.', cfg.key ? '' : 'No saved API key: check 5 should give HTTP 401, which is fine.'); });
    }
    document.addEventListener('keydown', function (e) { if (e.keyCode === 13) run(); });
    run();
  </script>
</body>
</html>
